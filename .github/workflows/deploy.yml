name: Laravel Build and Split Deploy via FTP

on:
  push:
    branches:
      - main # Ganti ke 'master' jika branch utama GitHub Anda namanya master

jobs:
  web-deploy:
    name: Deploy Laravel Split Folder
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚚 Ambil Code Terbaru
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: ⚡ Install NPM & Build Aset (Vite)
      run: |
        npm install
        npm run build

    - name: 📂 Pindahkan Folder Build ke Root (Sesuai Struktur Server)
      run: |
        # Memindahkan hasil build dari public/build ke root proyek agar masuk ke folder soul
        mv public/build ./build

    - name: 🚀 TAHAP 1: Upload Core Laravel & Folder Build ke folder soul
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: soul/ # Otomatis mengarah ke domains/souleven.my.id/soul/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/public/** # Mengabaikan folder public lokal pada tahap ini

    - name: 🚀 TAHAP 2: Upload Isi Folder Public ke public_html
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: public_html/ # Otomatis mengarah ke domains/souleven.my.id/public_html/
        local-dir: public/ # Hanya mengambil isi di dalam folder public lokal Anda
